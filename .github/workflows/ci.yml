name: CI

on:
  push:
    # Every branch is validated on push, so problems surface before a pull
    # request exists rather than after.
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # head_ref groups a pull request with its branch so a superseded run is
  # cancelled instead of racing the new one.
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  # Pinned so a CI run is reproducible and a compromised upstream release
  # cannot silently enter the pipeline. Bump deliberately.
  GOVULNCHECK_VERSION: v1.6.0
  GOSEC_VERSION: v2.22.9
  STATICCHECK_VERSION: v0.7.0
  # Go package patterns are scoped rather than ./... because dependency trees
  # under node_modules ship their own Go sources.
  GO_PACKAGES: ./cmd/... ./internal/...
  # Measured across ./cmd and ./internal. cmd/domain-check is process wiring
  # with no tests of its own and sits at 0%, so the aggregate is well below the
  # tested packages (internal/scanner 87%, internal/api 67%). Raise this as
  # coverage improves; it exists to stop erosion, not to certify a target.
  COVERAGE_FLOOR: '50.0'

jobs:
  go:
    name: Go build & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l ./cmd ./internal)
          if [ -n "$unformatted" ]; then
            echo "::error::Files are not gofmt-formatted"
            echo "$unformatted"
            gofmt -d ./cmd ./internal
            exit 1
          fi
      - name: Module metadata is tidy
        run: |
          go mod tidy
          if ! git diff --exit-code -- go.mod go.sum; then
            echo "::error::go.mod or go.sum is stale; run 'go mod tidy' and commit the result"
            exit 1
          fi
      - name: go vet
        run: go vet $GO_PACKAGES
      - name: Build
        run: go build $GO_PACKAGES
      - name: Tests (race detector, randomised order)
        # -shuffle=on surfaces tests that only pass because of ordering.
        run: go test -race -shuffle=on -covermode=atomic -coverprofile=coverage.out $GO_PACKAGES
      - name: Enforce coverage floor
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}' | tr -d '%')
          echo "Total statement coverage: ${total}% (floor ${COVERAGE_FLOOR}%)"
          if ! awk -v have="$total" -v want="$COVERAGE_FLOOR" 'BEGIN { exit (have + 0 >= want + 0) ? 0 : 1 }'; then
            echo "::error::Coverage ${total}% is below the ${COVERAGE_FLOOR}% floor"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: coverage.out
          retention-days: 7

  go-security:
    name: Go security (govulncheck, gosec, staticcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - name: govulncheck (known vulnerabilities)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}
          govulncheck $GO_PACKAGES
      - name: gosec (static security analysis)
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@${GOSEC_VERSION}
          gosec $GO_PACKAGES
      - name: staticcheck (correctness and dead code analysis)
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@${STATICCHECK_VERSION}
          staticcheck $GO_PACKAGES

  dockerfile:
    name: Dockerfile lint (hadolint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

  frontend:
    name: Frontend lint, tests & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Typecheck & build
        run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  frontend-e2e:
    name: Frontend end-to-end (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: E2E tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  worker:
    name: Worker lint, tests & config validation
    runs-on: ubuntu-latest
    needs: frontend
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - name: Validate wrangler config (deploy dry run)
        run: npm run validate:config

  container-image:
    name: Container image build & scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t domain-check:ci .
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: domain-check:ci
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
